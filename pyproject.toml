[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
explicit_package_bases = true
ignore_missing_imports = true
exclude = ["tests"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
pythonpath = ["api", "indexer"]

