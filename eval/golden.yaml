# FAST-NUCES Academic Policies Golden Evaluation Set (15 Questions)
# Covers: ordinary (8), version-sensitive (2), exact-term (2), must-abstain (2), prompt-injection (1)

questions:
  - id: q01
    type: ordinary
    question: "What is the minimum attendance percentage required to be eligible to sit for the final examination?"
    must_abstain: false
    relevant_passages:
      - source: "academic_rules_2026.pdf"
        section: "1.21"
        page: 12
    relevant:
      - source: "academic_rules_2026.pdf"
        section: "1.21"
        page: 12
    expect: "80"

  - id: q02
    type: ordinary
    question: "What is the minimum cumulative grade point average (CGPA) required to avoid being placed on academic warning?"
    must_abstain: false
    relevant_passages:
      - source: "academic_rules_2026.pdf"
        section: "5.4"
        page: 24
    relevant:
      - source: "academic_rules_2026.pdf"
        section: "5.4"
        page: 24
    expect: "2.00"

  - id: q03
