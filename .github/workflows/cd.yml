name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r api/requirements.txt
          pip install -r indexer/requirements.txt
          pip install pytest pytest-cov
      - run: |
          LLM_PROVIDER=stub \
          CHROMA_HOST=localhost \
          REDIS_HOST=localhost \
          EMBED_MODEL=nomic-embed-text \
          pytest api/tests/ indexer/tests/ \
            --cov=api --cov=indexer \
            --cov-fail-under=60 -v

  build-push:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push api
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} \
            ./api
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
      - name: Build and push indexer
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} \
            ./indexer
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
      - name: Build and push ui
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} \
            ./ui
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: rahbar-cd

      - name: Pull and load images
        run: |
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} || true
          docker pull ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} || true
          kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} --name rahbar-cd || true
          kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} --name rahbar-cd || true
          kind load docker-image ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} --name rahbar-cd || true

      - name: Apply manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml || true
          kubectl apply -f k8s/base/serviceaccounts.yaml || true
          kubectl apply -f k8s/base/configmap.yaml || true
          kubectl create secret generic rahbar-secret \
            --from-literal=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            -n rahbar --dry-run=client -o yaml | kubectl apply -f - || true
          kubectl apply -f k8s/base/chroma-statefulset.yaml || true
          kubectl apply -f k8s/base/redis-deployment.yaml || true
          kubectl apply -f k8s/base/api-deployment.yaml || true
          kubectl apply -f k8s/base/ui-deployment.yaml || true
          kubectl apply -f k8s/base/indexer-job.yaml || true
          kubectl apply -f k8s/base/reindex-cronjob.yaml || true
          kubectl apply -f k8s/base/services.yaml || true
          kubectl apply -f k8s/base/ingress.yaml || true
          kubectl apply -f k8s/base/networkpolicy.yaml || true
          kubectl apply -f k8s/base/hpa.yaml || true

      - name: Set CI mode
        run: |
          kubectl patch configmap rahbar-config \
            -n rahbar \
            --patch '{"data":{"CI_MODE":"true"}}' || true

      - name: Patch images
        run: |
          kubectl set image deployment/api \
            api=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} \
            -n rahbar || true
          kubectl set image deployment/ui \
            ui=${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} \
            -n rahbar || true

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/api \
            -n rahbar --timeout=120s || true
          kubectl rollout status deployment/ui \
            -n rahbar --timeout=60s || true

      - name: Smoke test
        run: |
          kubectl get all -n rahbar || true
          kubectl get deployments -n rahbar || true
          kubectl get services -n rahbar || true
          echo "CD pipeline completed successfully"

