name: CD

on:
  push:
    branches:
      - main

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt -r indexer/requirements.txt pytest pytest-cov
      - run: |
          PYTHONPATH=api:indexer LLM_PROVIDER=stub pytest api/tests/ indexer/tests/ \
            --cov=api --cov=indexer --cov-fail-under=60 -v

  build-push:
    needs: test
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest ./api
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest ./indexer
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest ./ui
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:latest

