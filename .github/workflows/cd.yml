name: CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r api/requirements.txt
          pip install -r indexer/requirements.txt
          pip install pytest pytest-cov
      - run: |
          LLM_PROVIDER=stub \
          CHROMA_HOST=localhost \
          REDIS_HOST=localhost \
          EMBED_MODEL=nomic-embed-text \
          pytest api/tests/ indexer/tests/ \
            --cov=api --cov=indexer \
            --cov-fail-under=60 -v

  build-push:
    name: Build and Push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build and push api
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} \
            ./api
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
      - name: Build and push indexer
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} \
            ./indexer
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
      - name: Build and push ui
        run: |
          docker build \
            -t ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} \
            ./ui
          docker push \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}

  deploy:
    name: Deploy
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: rahbar-cd
      - name: Pull and load images
        run: |
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }}
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }}
          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }}
          kind load docker-image \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-api:${{ github.sha }} \
            --name rahbar-cd
          kind load docker-image \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-indexer:${{ github.sha }} \
            --name rahbar-cd
          kind load docker-image \
            ${{ secrets.DOCKERHUB_USERNAME }}/rahbar-ui:${{ github.sha }} \
            --name rahbar-cd
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/serviceaccounts.yaml
          kubectl apply -f k8s/base/configmap.yaml
          kubectl apply -f k8s/base/secret-placeholder.yaml
          kubectl apply -f k8s/base/chroma-statefulset.yaml
          kubectl apply -f k8s/base/redis-deployment.yaml
          kubectl apply -f k8s/base/api-deployment.yaml
          kubectl apply -f k8s/base/ui-deployment.yaml
          kubectl apply -f k8s/base/indexer-job.yaml
          kubectl apply -f k8s/base/reindex-cronjob.yaml
          kubectl apply -f k8s/base/services.yaml
          kubectl apply -f k8s/base/ingress.yaml
          kubectl apply -f k8s/base/networkpolicy.yaml
          kubectl apply -f k8s/base/hpa.yaml
      - name: Wait for rollout
        run: |
          kubectl rollout status \
            deployment/api \
            -n rahbar \
            --timeout=120s
      - name: Smoke test
        run: |
          curl -f http://localhost/healthz || exit 1

