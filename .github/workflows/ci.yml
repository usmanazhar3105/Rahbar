name: CI

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - main

jobs:
  lint:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check api/ indexer/
      - run: mypy api/ indexer/ --ignore-missing-imports

  test:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r api/requirements.txt -r indexer/requirements.txt pytest pytest-cov
      - run: |
          PYTHONPATH=api:indexer LLM_PROVIDER=stub pytest api/tests/ indexer/tests/ \
            --cov=api --cov=indexer --cov-fail-under=60 -v

  manifests:
    needs: lint
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          curl -s https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh | bash
          sudo mv kustomize /usr/local/bin/ || true
          curl -L https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz | tar xz
      - run: |
          kustomize build k8s/overlays/prod | ./kubeconform -strict -summary

  build:
    needs: [test, manifests]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} ./api
      - run: docker build -t rahbar-indexer:${{ github.sha }} ./indexer
      - run: docker build -t rahbar-ui:${{ github.sha }} ./ui

  scan:
    needs: build
    permissions:
      contents: read
      security-events: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t rahbar-api:${{ github.sha }} ./api
      - uses: aquasecurity/trivy-action@master
        with:
          image-ref: rahbar-api:${{ github.sha }}
          exit-code: 0
          severity: HIGH,CRITICAL
          ignore-unfixed: true

  e2e-eval:
    needs: scan
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          cluster_name: kind
      - run: |
          docker build -t rahbar-api:local ./api
          docker build -t rahbar-indexer:local ./indexer
          docker build -t rahbar-ui:local ./ui
          kind load docker-image rahbar-api:local --name kind
          kind load docker-image rahbar-indexer:local --name kind
          kind load docker-image rahbar-ui:local --name kind
      - run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap.yaml
          kubectl create secret generic rahbar-secret \
            --from-literal=GROQ_API_KEY=stub -n rahbar
          kubectl apply -k k8s/base/
      - name: Wait for chroma and indexer
        run: |
          kubectl rollout status statefulset/chroma -n rahbar --timeout=120s
          for i in $(seq 1 60); do
            STATUS=$(kubectl get job/indexer -n rahbar -o jsonpath='{.status.conditions[?(@.type=="Complete")].status}')
            FAILED=$(kubectl get job/indexer -n rahbar -o jsonpath='{.status.conditions[?(@.type=="Failed")].status}')
            if [ "$STATUS" = "True" ]; then
              echo "Job/indexer completed successfully!"
              exit 0
            fi
            if [ "$FAILED" = "True" ]; then
              echo "Job/indexer failed!"
              exit 1
            fi
            sleep 5
          done
          echo "Timed out waiting for job/indexer"
          exit 1

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl get pods,jobs,networkpolicy -n rahbar -o wide
          kubectl describe job/indexer -n rahbar || true
          kubectl logs job/indexer -n rahbar --all-containers --tail=300 || true
          kubectl describe pods -n rahbar || true
          kubectl get events -n rahbar --sort-by=.lastTimestamp
      - run: |
          kubectl rollout status deployment/api \
            -n rahbar --timeout=120s
      - run: |
          pip install -r api/requirements.txt pyyaml httpx
          kubectl port-forward -n rahbar service/api-service 8000:8000 &
          for i in $(seq 1 30); do
            curl -s http://localhost:8000/healthz && break || sleep 1
          done
          LLM_PROVIDER=stub python eval/run_eval.py \
            --api http://localhost:8000 --golden eval/golden.yaml
