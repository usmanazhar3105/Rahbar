name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff mypy
      - run: ruff check api/ indexer/
      - run: mypy api/ indexer/ --ignore-missing-imports

  test:
    name: Test
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install -r api/requirements.txt
          pip install -r indexer/requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          cd api && \
          LLM_PROVIDER=stub \
          CHROMA_HOST=localhost \
          REDIS_HOST=localhost \
          EMBED_MODEL=nomic-embed-text \
          GROQ_API_KEY=stub-key \
          TOP_K=5 \
          RELEVANCE_FLOOR=0.3 \
          CACHE_THRESHOLD=0.92 \
          TEMPERATURE=0.1 \
          PYTHONPATH=. \
          python -m pytest tests/ --cov=app -v
          cd .. && \
          cd indexer && \
          LLM_PROVIDER=stub \
          CHROMA_HOST=localhost \
          REDIS_HOST=localhost \
          EMBED_MODEL=nomic-embed-text \
          GROQ_API_KEY=stub-key \
          PYTHONPATH=. \
          python -m pytest tests/ --cov=pipeline -v

  manifests:
    name: Validate Manifests
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2
        with:
          kustomize-version: "5.3.0"

      - name: Install kubeconform
        run: |
          curl -sL "https://github.com/yannh/kubeconform/releases/download/v0.6.4/kubeconform-linux-amd64.tar.gz" \
          | tar xz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate
        run: |
          kustomize build k8s/overlays/prod | \
          kubeconform -strict -summary

  build:
    name: Build Images
    needs: [test, manifests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Build api
        run: |
          docker build -t rahbar-api:${{ github.sha }} ./api
      - name: Build indexer
        run: |
          docker build -t rahbar-indexer:${{ github.sha }} ./indexer
      - name: Build ui
        run: |
          docker build -t rahbar-ui:${{ github.sha }} ./ui

  e2e-eval:
    name: E2E Evaluation
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: rahbar-ci
      - name: Load images into kind
        run: |
          docker build -t rahbar-api:${{ github.sha }} ./api
          docker build -t rahbar-indexer:${{ github.sha }} ./indexer
          docker build -t rahbar-ui:${{ github.sha }} ./ui
          kind load docker-image \
            rahbar-api:${{ github.sha }} \
            --name rahbar-ci
          kind load docker-image \
            rahbar-indexer:${{ github.sha }} \
            --name rahbar-ci
          kind load docker-image \
            rahbar-ui:${{ github.sha }} \
            --name rahbar-ci
      - name: Create CI secret
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl create secret generic rahbar-secret \
            --from-literal=GROQ_API_KEY=stub-key-for-ci \
            -n rahbar \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: Apply manifests
        run: |
          kubectl apply -f k8s/base/namespace.yaml
          kubectl apply -f k8s/base/configmap.yaml
          kubectl apply -f k8s/base/serviceaccounts.yaml
          kubectl apply -f k8s/base/chroma-statefulset.yaml
          kubectl apply -f k8s/base/redis-deployment.yaml
          kubectl apply -f k8s/base/api-deployment.yaml
          kubectl apply -f k8s/base/ui-deployment.yaml
          kubectl apply -f k8s/base/indexer-job.yaml
          kubectl apply -f k8s/base/reindex-cronjob.yaml
          kubectl apply -f k8s/base/services.yaml
          kubectl apply -f k8s/base/ingress.yaml
          kubectl apply -f k8s/base/networkpolicy.yaml
          kubectl apply -f k8s/base/hpa.yaml
      - name: Patch for CI (use stub provider)
        run: |
          kubectl patch configmap rahbar-config \
            -n rahbar \
            --patch '{"data":{"LLM_PROVIDER":"stub"}}'
      - name: Debug indexer status
        run: |
          kubectl get pods -n rahbar
          kubectl describe job indexer -n rahbar
          kubectl logs job/indexer -n rahbar || true
      - name: Wait for indexer Job
        run: |
          kubectl wait \
            --for=condition=complete \
            job/indexer \
            -n rahbar \
            --timeout=600s || \
          (kubectl logs job/indexer -n rahbar && exit 1)
      - name: Wait for api rollout
        run: |
          kubectl rollout status \
            deployment/api \
            -n rahbar \
            --timeout=120s
      - name: Run evaluation gate
        run: |
          pip install -r api/requirements.txt
          LLM_PROVIDER=stub \
          python eval/run_eval.py \
            --base-url http://localhost/api

