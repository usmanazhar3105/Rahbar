# Configuration file for corpus verification (Assignment 02 - RAHBAR)
# Declares required corpus properties for verify_corpus.py

version_pairs:
  - doc_a: "academic_rules_aug2023.pdf"
    doc_b: "academic_rules_handbook_jun2026.pdf"
    version_a: "2023-08"
    version_b: "2026-06"
    superseded: "2023-08"
    older:
      file: "academic_rules_aug2023.pdf"
      doc_version: "2023-08"
      superseded: true
    newer:
      file: "academic_rules_handbook_jun2026.pdf"
      doc_version: "2026-06"
      superseded: false
    notes: >
      The 2026 Handbook supersedes the August 2023 Rules. Changes include
      updated attendance criteria, academic warning thresholds, and revised CGPA rules.

scanned_pdf: "faculty_entrepreneurship_policy.pdf"
scanned_document:
  file: "faculty_entrepreneurship_policy.pdf"
  doc_version: "2022-05"
  notes: >
    This document was scanned or published without an embedded text layer (empty font list in pdffonts).
    The indexer pipeline runs OCR (Tesseract) on its pages.

absent_topic:
  topic: "hostel and transport facilities"
  reason: "Transport and Hostel PDF excluded deliberately"
  excluded_document: "Transport and Hostel Facilities.pdf"
  keywords:
    - "hostel"
    - "transport"
    - "accommodation"
    - "mess"

deliberately_absent_topic:
  topic: "hostel and transport facilities"
  reason: "Transport and Hostel PDF excluded deliberately"
  excluded_document: "Transport and Hostel Facilities.pdf"
  keywords:
    - "hostel"
    - "transport"
    - "accommodation"
    - "mess"

exact_term_content:
  examples:
    - term: "1.21"
      pattern: "\\b1\\.21\\b"
      description: "Attendance requirement clause in Academic Rules"
    - term: "5.4"
      pattern: "\\b5\\.4\\b"
      description: "Academic warning rules clause"
    - term: "10,000"
      pattern: "10[,.]?000"
      description: "Tuition fee per credit hour (PKR)"
