<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAHBAR — Grounded RAG Assistant</title>
    <style>
        :root {
            --primary: #10b981;
            --primary-dark: #059669;
            --bg: #0f172a;
            --card: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        header h1 { font-size: 1.25rem; font-weight: 700; color: var(--primary); }
        header p { font-size: 0.85rem; color: var(--text-muted); }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
            max-width: 900px;
            margin: 0 auto;
            width: 100%;
        }
        .msg {
            padding: 1rem 1.25rem;
            border-radius: 0.75rem;
            max-width: 80%;
            line-height: 1.5;
            font-size: 0.95rem;
        }
        .user-msg {
            background: var(--primary-dark);
            align-self: flex-end;
            color: #fff;
        }
        .bot-msg {
            background: var(--card);
            border: 1px solid var(--border);
            align-self: flex-start;
        }
        .citations {
            margin-top: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid var(--border);
            font-size: 0.8rem;
            color: var(--text-muted);
        }
        .citation-tag {
            display: inline-block;
            background: rgba(16, 185, 129, 0.15);
            color: var(--primary);
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            margin: 0.2rem;
            font-size: 0.75rem;
        }
        footer {
            background: var(--card);
            border-top: 1px solid var(--border);
            padding: 1rem;
        }
        form {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            gap: 0.75rem;
        }
        input {
            flex: 1;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: var(--primary); }
        button {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background: var(--primary-dark); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>RAHBAR</h1>
            <p>FAST-NUCES Academic Policy QA</p>
        </div>
        <span style="font-size:0.8rem; background:#334155; padding:0.25rem 0.6rem; border-radius:1rem;">Grounded RAG</span>
    </header>
    <div id="chat">
        <div class="msg bot-msg">
            Hello! Ask me any question regarding FAST-NUCES academic rules, policies, or fee structures.
        </div>
    </div>
    <footer>
        <form id="form">
            <input id="input" type="text" placeholder="Ask a question (e.g. What is the minimum CGPA for warning?)..." autocomplete="off" required>
            <button id="send-btn" type="submit">Ask</button>
        </form>
    </footer>
    <script>
        const chat = document.getElementById('chat');
        const form = document.getElementById('form');
        const input = document.getElementById('input');
        const btn = document.getElementById('send-btn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = input.value.trim();
            if (!q) return;

            // Append user message
            const uMsg = document.createElement('div');
            uMsg.className = 'msg user-msg';
            uMsg.textContent = q;
            chat.appendChild(uMsg);
            input.value = '';
            btn.disabled = true;

            // Loading placeholder
            const bMsg = document.createElement('div');
            bMsg.className = 'msg bot-msg';
            bMsg.textContent = 'Thinking...';
            chat.appendChild(bMsg);
            chat.scrollTop = chat.scrollHeight;

            try {
                const res = await fetch('/api/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ question: q })
                });
                const data = await res.json();
                bMsg.textContent = data.answer || 'No answer returned.';

                if (data.citations && data.citations.length > 0) {
                    const citDiv = document.createElement('div');
                    citDiv.className = 'citations';
                    citDiv.innerHTML = '<strong>Sources:</strong><br>';
                    data.citations.forEach(c => {
                        const tag = document.createElement('span');
                        tag.className = 'citation-tag';
                        tag.textContent = `${c.source} (p.${c.page || 'N/A'})`;
                        citDiv.appendChild(tag);
                    });
                    bMsg.appendChild(citDiv);
                }
            } catch (err) {
                bMsg.textContent = 'Error connecting to API service: ' + err.message;
            } finally {
                btn.disabled = false;
                chat.scrollTop = chat.scrollHeight;
            }
        });
    </script>
</body>
</html>
