apiVersion: batch/v1
kind: Job
metadata:
  name: eval
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: evaluation
    app: eval-job
spec:
  backoffLimit: 0
  template:
    metadata:
      labels:
        app: eval-job
        app.kubernetes.io/name: rahbar
        app.kubernetes.io/component: evaluation
    spec:
      enableServiceLinks: false
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: rahbar-data
          persistentVolumeClaim:
            claimName: rahbar-data
      containers:
        - name: evaluator
          image: rahbar-eval:latest
          imagePullPolicy: Never
          command:
            - "python"
            - "eval/run_eval.py"
            - "--base-url"
            - "http://api-service:8000/api"
            - "--output"
            - "/data/results/"
          volumeMounts:
            - name: rahbar-data
              mountPath: /data
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: GROQ_API_KEY
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
