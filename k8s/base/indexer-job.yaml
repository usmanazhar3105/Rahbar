# Memory limit 1024Mi justified:
# OCR of 300dpi PDF pages peaks at ~485MiB (kubectl top pods)
# 2x headroom gives 1024Mi limit
# OOMKill exits with code 137 (128 + SIGKILL)

apiVersion: batch/v1
kind: Job
metadata:
  name: indexer
  namespace: rahbar
spec:
  backoffLimit: 3
  template:
    spec:
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      containers:
        - name: indexer
          image: DOCKERHUB_USERNAME/rahbar-indexer:latest
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: GROQ_API_KEY
          resources:
            requests:
              cpu: "200m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1024Mi"

