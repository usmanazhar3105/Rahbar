apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: rahbar
  labels:
    app: api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: api
---
apiVersion: v1
kind: Service
metadata:
  name: ui-service
  namespace: rahbar
  labels:
    app: ui
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      protocol: TCP
      name: http
  selector:
    app: ui
---
apiVersion: v1
kind: Service
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app: chroma
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  selector:
    app: chroma
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: rahbar
  labels:
    app: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: 6379
      protocol: TCP
      name: redis
  selector:
    app: redis

