apiVersion: v1
kind: ConfigMap
metadata:
  name: rahbar-config
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: config
data:
  RETRIEVER: "chroma"
  CHROMA_HOST: "chroma"
  CHROMA_COLLECTION: "rahbar_docs"
  COLLECTION_NAME: "rahbar_docs"
  REDIS_HOST: "redis"
  EMBED_MODEL: "nomic-embed-text"
  EMBED_MODEL_VERSION: "1.0"
  COLLECTION_VERSION: "v1"
  TRACE_DIR: "/data/traces"
  TRACE_STDOUT: "true"
  TOP_K: "5"
  RELEVANCE_FLOOR: "0.3"
  CACHE_THRESHOLD: "0.92"
  TEMPERATURE: "0.1"
  LLM_PROVIDER: "ollama-host"
  LLM_MODEL: "llama3.2:1b"
  GROQ_MODEL: "llama-3.1-8b-instant"
  OLLAMA_HOST: "http://host.minikube.internal:11434"
  # Release Gate Thresholds (editable live via kubectl edit configmap rahbar-config)
  RECALL_AT_5_MIN_DROP: "2.0"
  FAITHFULNESS_MIN: "0.75"
  P95_LATENCY_MAX_MS: "3000"
  ABSTENTION_CORRECTNESS_MIN: "1.0"
