apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: api
    app: api
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      port: 8000
      targetPort: 8000
    - name: metrics
      port: 9090
      targetPort: 8000
