# Memory limit 1024Mi: OCR of 300dpi PDF pages 
# peaks at ~485MiB measured via kubectl top pods
apiVersion: batch/v1
kind: CronJob
metadata:
  name: reindex
  namespace: rahbar
  labels:
    app: indexer
spec:
  schedule: "0 2 * * 0"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 3
      template:
        metadata:
          labels:
            app: indexer
        spec:
          serviceAccountName: indexer-sa
          restartPolicy: OnFailure
          containers:
            - name: indexer
              image: rahbar-indexer:local
              imagePullPolicy: IfNotPresent
              env:
                - name: HOME
                  value: /tmp
              envFrom:
                - configMapRef:
                    name: rahbar-config
              resources:
                requests:
                  cpu: 200m
                  memory: 512Mi
                limits:
                  cpu: 1000m
                  memory: 1024Mi
              volumeMounts:
                - name: tmp-dir
                  mountPath: /tmp
          volumes:
            - name: tmp-dir
              emptyDir: {}
