# StatefulSet not Deployment:
# Gives stable network identity (chroma-0) and ordered
# PVC binding. A Deployment reschedule creates a new PVC,
# losing the entire vector index. See docs/adr/0001.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: vectordb
    app: chroma
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
        app.kubernetes.io/name: rahbar
        app.kubernetes.io/component: vectordb
    spec:
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      containers:
        - name: chroma
          image: chromadb/chroma:latest
          ports:
            - containerPort: 8000
              name: http
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/data
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
