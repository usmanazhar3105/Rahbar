# StatefulSet not Deployment:
# Gives stable network identity (chroma-0) and ordered
# PVC binding. A Deployment reschedule creates a new PVC,
# losing the entire vector index. See docs/adr/0001.

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: chroma
  namespace: rahbar
spec:
  serviceName: chroma
  replicas: 1
  selector:
    matchLabels:
      app: chroma
  template:
    metadata:
      labels:
        app: chroma
    spec:
      serviceAccountName: indexer-sa
      automountServiceAccountToken: false
      containers:
        - name: chroma
          image: chromadb/chroma:0.4.24
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: chroma-data
              mountPath: /chroma/chroma
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
  volumeClaimTemplates:
    - metadata:
        name: chroma-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi

