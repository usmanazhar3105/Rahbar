apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-candidate
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: api-candidate
    app: api-candidate
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-candidate
  template:
    metadata:
      labels:
        app: api-candidate
        app.kubernetes.io/name: rahbar
        app.kubernetes.io/component: api-candidate
    spec:
      enableServiceLinks: false
      serviceAccountName: api-sa
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: tmp
          emptyDir: {}
        - name: rahbar-data
          persistentVolumeClaim:
            claimName: rahbar-data
      containers:
        - name: api
          image: rahbar-api:candidate
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: rahbar-config
          env:
            # Candidate points to dedicated candidate collection
            - name: CHROMA_COLLECTION
              value: "rahbar_candidate"
            - name: COLLECTION_NAME
              value: "rahbar_candidate"
            - name: COLLECTION_VERSION
              value: "candidate"
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: rahbar-secret
                  key: GROQ_API_KEY
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: rahbar-data
              mountPath: /data/corpus
              subPath: corpus
              readOnly: true
            - name: rahbar-data
              mountPath: /data/traces
              subPath: traces
              readOnly: false
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 20
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 10
            failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: api-candidate-service
  namespace: rahbar
  labels:
    app.kubernetes.io/name: rahbar
    app.kubernetes.io/component: api-candidate
    app: api-candidate
spec:
  type: ClusterIP
  selector:
    app: api-candidate
  ports:
    - name: http
      port: 8001
      targetPort: 8000
