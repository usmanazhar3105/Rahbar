apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: rahbar

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: api
      spec:
        replicas: 1
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rahbar-config
      data:
        LLM_PROVIDER: "stub"

